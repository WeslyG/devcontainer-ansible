name: Build, test and publish Ansible images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scan_published:
        description: Scan published images and retain dependency/security reports
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ansible-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@@CHECKOUT@
      - name: Check Docker Hub credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - name: Verify Docker Hub login
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@@LOGIN@
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Choose dated release from published tags
        id: version
        run: |
          release=$(python3 scripts/version.py --check-registry)
          echo "release=$release" >> "$GITHUB_OUTPUT"
  image:
    name: Build Ansible ${{ matrix.ansible }} (${{ matrix.machine.arch }})
    needs: version
    env:
      PLATFORM_VERSION: ${{ needs.version.outputs.release }}
      TAG_VERSION: ${{ needs.version.outputs.release }}
    strategy:
      fail-fast: false
      matrix:
        ansible: ['10', '12', '14']
        machine:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@@CHECKOUT@
      - uses: actions/setup-node@@SETUP_NODE@
        with:
          node-version: '@NODE@'
      - uses: docker/setup-buildx-action@@BUILDX@
        id: buildx
      - name: Install pinned devcontainer CLI
        run: npm install --global @devcontainers/cli@@DEVCONTAINER@
      - name: Check repository invariants
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s tests
      - name: Build and verify common native Go CLI stage
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx build --platform linux/${{ matrix.machine.arch }} --target go-cli-builder --output type=cacheonly -f .devcontainer/Dockerfile .
      - name: Release compiler caches on the ephemeral CI builder
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx prune --force --filter type=exec.cachemount
      - name: Build and test native image
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 scripts/build.py --variants ${{ matrix.ansible }} --test
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@@LOGIN@
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Push tested native image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/publish.py stage --variant ${{ matrix.ansible }} --arch ${{ matrix.machine.arch }}
      - name: Prepare explicit public reports
        if: always()
        run: python3 scripts/artifacts.py build --arch ${{ matrix.machine.arch }}
      - uses: actions/upload-artifact@@UPLOAD@
        if: always()
        with:
          name: validation-ansible${{ matrix.ansible }}-${{ env.PLATFORM_VERSION }}-${{ matrix.machine.arch }}
          path: |
            artifacts/status.json
            artifacts/results.json
            artifacts/images.json
            artifacts/publish-${{ matrix.ansible }}-${{ matrix.machine.arch }}.json
          retention-days: ${{ github.retention_days }}
  publish:
    needs: [version, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLATFORM_VERSION: ${{ needs.version.outputs.release }}
      TAG_VERSION: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@@CHECKOUT@
      - uses: docker/setup-buildx-action@@BUILDX@
      - uses: actions/download-artifact@@DOWNLOAD@
        with:
          pattern: validation-ansible*-${{ env.PLATFORM_VERSION }}-*
          path: .build/publish
          merge-multiple: false
      - name: Login to Docker Hub
        uses: docker/login-action@@LOGIN@
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Publish and verify multiarch release tags
        run: python3 scripts/publish.py merge --directory .build/publish
  scan-published:
    name: Scan published images (${{ matrix.machine.arch }})
    needs: [version, publish]
    if: >-
      needs.publish.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.scan_published) ||
       (github.event_name != 'workflow_dispatch' && vars.SCAN_PUBLISHED_IMAGES != 'false'))
    strategy:
      fail-fast: false
      matrix:
        machine:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 40
    env:
      PLATFORM_VERSION: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@@CHECKOUT@
      - uses: actions/download-artifact@@DOWNLOAD@
        with:
          pattern: validation-ansible*-${{ env.PLATFORM_VERSION }}-*
          path: .build/publish
          merge-multiple: false
      - name: Login to Docker Hub
        uses: docker/login-action@@LOGIN@
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Scan immutable published images
        run: python3 scripts/scan_release.py --directory .build/publish --arch ${{ matrix.machine.arch }}
      - name: Prepare explicit scan reports
        if: always()
        run: python3 scripts/artifacts.py scan --arch ${{ matrix.machine.arch }}
      - uses: actions/upload-artifact@@UPLOAD@
        if: always()
        with:
          name: security-${{ env.PLATFORM_VERSION }}-${{ matrix.machine.arch }}-attempt${{ github.run_attempt }}
          path: |
            artifacts/status.json
            artifacts/scan-${{ matrix.machine.arch }}.tar.gz
            artifacts/scan-metadata.json
            artifacts/scan-summary.md
          retention-days: ${{ github.retention_days }}

  badges:
    name: Update vulnerability badges
    needs: [version, publish, scan-published]
    if: >-
      always() && !cancelled() && needs.publish.result == 'success' &&
      needs['scan-published'].result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PLATFORM_VERSION: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@@CHECKOUT@
        with:
          ref: main
      - uses: actions/download-artifact@@DOWNLOAD@
        with:
          pattern: security-${{ env.PLATFORM_VERSION }}-*-attempt*
          path: .build/badge-inputs
      - name: Refresh badges from existing scan snapshots
        run: |
          git pull --ff-only origin main
          python3 scripts/badges.py --directory .build/badge-inputs
          git add -- README.md compatibility/security-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh vulnerability badges [skip ci]'
          git push origin HEAD:main
