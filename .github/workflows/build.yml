name: Build and test Ansible images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        ansible: ['10', '12', '14']
        machine:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Install pinned devcontainer CLI
        run: npm install --global @devcontainers/cli@0.90.0
      - name: Check repository invariants
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s tests
      - name: Build and test without publishing
        run: python3 scripts/build.py --variants ${{ matrix.ansible }} --test
      - name: Prepare explicit public reports
        if: always()
        run: python3 scripts/artifacts.py build --arch ${{ matrix.machine.arch }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-ansible${{ matrix.ansible }}-${{ matrix.machine.arch }}
          path: |
            artifacts/status.json
            artifacts/results.json
            artifacts/images.json
          retention-days: 14
